name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend-Vercel/package-lock.json'
      - run: cd frontend-Vercel && npm ci
      - run: cd frontend-Vercel && npm run lint
      - run: cd frontend-Vercel && npm run typecheck
      - run: cd frontend-Vercel && npm run test
      - run: cd frontend-Vercel && npm run build
